<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Bootstrap Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #050505;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 2rem;
      max-width: 400px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    p { color: #888; margin-bottom: 1.5rem; font-size: 0.95rem; }
    button {
      background: #fff;
      color: #000;
      border: none;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      margin: 0.5rem;
    }
    button:hover { opacity: 0.9; }
    .status { margin-top: 1.5rem; font-size: 0.9rem; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .uid { font-family: monospace; font-size: 0.8rem; color: #666; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bootstrap Admin</h1>
    <p>Sign in with Google, then click "Make Me Admin" to bootstrap your admin access.</p>
    
    <div id="auth-section">
      <button id="login-btn">Sign in with Google</button>
    </div>
    
    <div id="admin-section" style="display: none;">
      <p class="uid" id="uid-display"></p>
      <button id="make-admin-btn">Make Me Admin</button>
      <button id="logout-btn" style="background: transparent; color: #888; border: 1px solid #333;">Logout</button>
    </div>
    
    <p id="status" class="status"></p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDVFgw_hGcDQHf0iCo2adlkDOL6U7VsdaM",
      authDomain: "cubecon-2026.firebaseapp.com",
      projectId: "cubecon-2026",
      storageBucket: "cubecon-2026.firebasestorage.app",
      messagingSenderId: "661185183975",
      appId: "1:661185183975:web:c2daafe316604a349be242"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const authSection = document.getElementById('auth-section');
    const adminSection = document.getElementById('admin-section');
    const uidDisplay = document.getElementById('uid-display');
    const status = document.getElementById('status');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authSection.style.display = 'none';
        adminSection.style.display = 'block';
        uidDisplay.textContent = `UID: ${user.uid}`;
      } else {
        authSection.style.display = 'block';
        adminSection.style.display = 'none';
      }
    });

    document.getElementById('login-btn').onclick = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        status.className = 'status error';
        status.textContent = e.message;
      }
    };

    document.getElementById('logout-btn').onclick = () => signOut(auth);

    document.getElementById('make-admin-btn').onclick = async () => {
      const user = auth.currentUser;
      if (!user) return;
      
      try {
        status.className = 'status';
        status.textContent = 'Adding admin...';
        
        await setDoc(doc(db, 'cubecon_admins', user.uid), {
          role: 'admin',
          email: user.email,
          createdAt: new Date().toISOString()
        });
        
        status.className = 'status success';
        status.textContent = '✓ Admin access granted! Go to /admin.html';
      } catch (e) {
        status.className = 'status error';
        status.textContent = e.message;
      }
    };
  </script>
</body>
</html>
